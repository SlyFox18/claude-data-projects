Screens:
  scrOneTimeOrder:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |+
        =Set(varWizardStep, 1);
        Reset(txtOrderName);
        Clear(colSelectedMonths);
        If(
            IsEmpty(colBranches),
            ClearCollect(colReorderCache, fact_nonjd_reorder);
            ClearCollect(colBranches, Distinct(colReorderCache, Branch));
            ClearCollect(colBranches, Sort(
                ForAll(colBranches, {Value: ThisRecord.Value, SortKey: Value(ThisRecord.Value)}),
                SortKey, SortOrder.Ascending
            ))
        );
        If(
            !IsBlank(varSelectedBranch),
            ClearCollect(colReorderCache, Filter(fact_nonjd_reorder, Branch = varSelectedBranch))
        );



    Children:
      - Rectangle_Header_Reorder_1:
          Control: Rectangle
