      - Button_Calculate:
          Control: Classic/Button
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            Fill: =RGBA(0, 120, 212, 1)
            Font: =Font.'Segoe UI'
            Height: =56
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(16, 110, 190, 1)
            OnSelect: |+
              =If(
                  IsEmpty(colSelectedFranchises) && IsEmpty(colSelectedDealerGroups) && IsEmpty(colSelectedVendors),
                  Notify("Select at least one Franchise, Dealer Group Code, or Vendor Code before calculating.", NotificationType.Warning),
                  ClearCollect(colReorderBranch,
                      Filter(colReorderCache,
                          Branch = varSelectedBranch &&
                          (IsEmpty(colSelectedFranchises) || Franchise in colSelectedFranchises.Value) &&
                          (IsEmpty(colSelectedDealerGroups) || DealerGroupCode in colSelectedDealerGroups.Value) &&
                          (IsEmpty(colSelectedVendors) || VendorCode in colSelectedVendors.Value)
                      )
                  );
                  Clear(colReorderBranchKeyed);
                  ForAll(colReorderBranch,
                      Collect(colReorderBranchKeyed, {Branch: Branch, PartNumber: PartNumber, Description: Description, Franchise: Franchise, QuantityOnHand: QuantityOnHand, PN: PartNumber, AvgSales: AvgMonthlySales, AvgDemand: AvgMonthlyDemand})
                  );
                  Clear(colOneTimeResults);
                  ForAll(colReorderBranchKeyed,
                      If(AvgSales * CountRows(colSelectedMonths) * Value(txtLoadingFactor.Text) - QuantityOnHand > 0,
                          Collect(colOneTimeResults, {PartNumber: PN, Description: Description, Franchise: Franchise, AnticipatedSales: AvgSales * CountRows(colSelectedMonths) * Value(txtLoadingFactor.Text), AvgMonthlySales: AvgSales * Value(txtLoadingFactor.Text), OnHandQty: QuantityOnHand, RecommendedQty: AvgSales * CountRows(colSelectedMonths) * Value(txtLoadingFactor.Text) - QuantityOnHand, AnticipatedDemands: AvgDemand * CountRows(colSelectedMonths), IsIncluded: true})
                      )
                  );
                  Notify(CountRows(colOneTimeResults) & " parts calculated", NotificationType.Success)
              )

            PressedBorderColor: =RGBA(0, 69, 120, 1)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(16, 110, 190, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Text: ="Calculate"
            Visible: =varWizardStep = 2
            Width: =170
            X: =972
            Y: =106
