            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(16, 110, 190, 1)
            OnSelect: |
              =ClearCollect(
                  colExportData,
                  Filter(
                      fact_nonjd_reorder,
                      Branch = varSelectedBranch &&
                      Franchise = ddFranchise.Selected.Value &&
                      (!varShowOrdersOnly || RecommendedOrderQty > 0) &&
                      (!varLowMarginOnly || MarginFlag = "LOW") &&
                      (!varActiveOnly || Current12MoSales > 0 || Current12MoRequests > 0)
                  )
              );
              RemoveIf(
                  colExportData,
                  With(
                      {thisPN: PartNumber, thisBranch: Branch},
                      !IsBlank(LookUp(colExcluded, PartNumber = thisPN && Branch = thisBranch))
                  )
              );
              Notify(
                  Text(CountRows(colExportData), "#,##0") & " parts ready for export.",
                  NotificationType.Information
              )
            PressedBorderColor: =RGBA(0, 69, 120, 1)
            PressedColor: =RGBA(255, 255, 255, 1)
