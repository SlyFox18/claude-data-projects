            Fill: =RGBA(30, 41, 59, 1)
            FocusedBorderThickness: =4
            Height: =80
            HoverFill: =RGBA(30, 41, 59, 1)
            PressedFill: =RGBA(30, 41, 59, 1)
            Width: =1366
            X: =0.00
