Screens:
  scrReorder:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |
        =ClearCollect(colReorderCache, fact_nonjd_reorder);
        ClearCollect(colBranches, Distinct(colReorderCache, Branch));
        ClearCollect(
            colBranches,
            Sort(
                ForAll(colBranches, {Value: ThisRecord.Value, SortKey: Value(ThisRecord.Value)}),
                SortKey,
                SortOrder.Ascending
            )
        );
        If(IsBlank(varSelectedBranch), Set(varSelectedBranch, First(colBranches).Value));
        Set(varActiveOnly, true);
        ClearCollect(colFranchiseList, {Value: "All"});
        Collect(colFranchiseList, SortByColumns(Distinct(Filter(colReorderCache, Branch = varSelectedBranch), Franchise), "Value", SortOrder.Ascending))
    Children:
      - Rectangle_Header_Reorder:
          Control: Rectangle
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =2
